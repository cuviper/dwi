[package]
name = "dwi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "DWARF Inspector: an interactive DIE and attribute browser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuviper/dwi"
readme = "README.md"
keywords = ["dwarf", "debugging", "elf", "tui", "browser"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "dwi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
crc32fast = "1.5.5"
flate2 = "1.1.11"
gimli = { version = "0.34.0", default-features = false, features = ["read", "std", "endian-reader"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "optimization"] }
object = { version = "0.41.0", default-features = false, features = ["read", "compression"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ruzstd = "0.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["system"] }

[dev-dependencies]
gimli = { version = "0.34.0", default-features = false, features = ["write"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["encoder"] }
object = { version = "0.41.0", default-features = false, features = ["write"] }
tempfile = "3.27.0"
